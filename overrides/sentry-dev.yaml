# Specific overrides for sentry in common/dev namespace

hooks:
  novumBootstrap:
    env:
    - name: SENTRY_METRICS_PREFIX
      value: "sentry"
    sentryApiTokens:
      sourcemaps: "TestApiTokenSourcemaps"

system:
  url: "https://sentry-dev.tuenti.io"

filestore:
  filesystem:
    persistence:
      storageAccount: "devglobalnortheurope04"
      resourceGroup: "dev-global-northeurope04-resource-group"
      storageClass: "azurefile-common-sentry-data"
      size: "8Gi"

novum:
  statsiteProxy:
    # No dummy statsite-proxy service is created and we'll use the statsite-proxy.common one
    # We don't need this in sentry dev because statsite-proxy.common will be always available before
    # installing our sentry. This is only needed when installing sentry in a new cluster, where Kraken
    # hasn't installed statsite-proxy yet
    enabled: false

config:
  sentryExtraConfPy: |
    ########
    # DSN  #
    ########

    # This is used to generate the DSN. When an internal error is triggered it will also use this endpoint
    # Make sure to match the service name
    SENTRY_ENDPOINT = "http://sentry.common"

    ##################
    # StatsD Metrics #
    ##################

    SENTRY_METRICS_PREFIX = "platform.metrics.dev.common.sentry_internal."

    SENTRY_METRICS_BACKEND = "sentry.metrics.statsd.StatsdMetricsBackend"
    SENTRY_METRICS_OPTIONS = {
        "host": os.getenv("SENTRY_STATSITE_PROXY", "statsite-proxy.common"),
        "port": 8125,
    }
